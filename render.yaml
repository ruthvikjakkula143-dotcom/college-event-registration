services:
  # ── Backend: Spring Boot ────────────────────────────────────────────────────
  - type: web
    name: college-event-backend
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

  # ── Frontend: React Static Site ─────────────────────────────────────────────
  - type: web
    name: college-event-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    plan: free
    envVars:
      - key: VITE_API_BASE
        sync: false
